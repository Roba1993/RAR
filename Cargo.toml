[package]
name = "rar"
version = "0.6.0"
authors = ["Robert Schütte <schuetterobert@gmail.com>", "Michael Stowe <michael.stowe@member.mensa.org>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Roba1993/RAR"
homepage = "https://github.com/Roba1993/RAR"
description = """
Rust native RAR extractor based upon nom
"""
edition = "2021"
rust-version = "1.89"
exclude = [
    "assets/*",
]

[dependencies]
nom = "8.0"
thiserror = "2.0"
chrono = "0.4"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
crc32fast = "1.5"

[dev-dependencies]
lazy_static = "1.5"
